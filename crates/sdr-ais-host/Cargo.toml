[package]
name = "sdr-ais-host"
version.workspace = true
edition.workspace = true

# Runs on the host, outside the sandbox. Deliberately contains no parsers: the
# tap copies raw USB bytes to a socket, the proxy copies TCP bytes to a socket.

[dependencies]
ais-core.workspace = true
anyhow.workspace = true
clap.workspace = true
rs-rtl.workspace = true
rusqlite = { version = "0.34", features = ["bundled"] }
serde_json.workspace = true
tokio.workspace = true
